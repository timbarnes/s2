# Test threads get the same large stack as the s2 binary's session thread
# (src/main.rs, STACK_SIZE): expansion and code generation recurse over
# deeply nested code.
[env]
RUST_MIN_STACK = "1073741824"

# cargo doc documents private items too: the internal docs are for working
# on s2 (published under api/ by .github/workflows/docs.yml).
[build]
rustdocflags = ["--document-private-items"]
