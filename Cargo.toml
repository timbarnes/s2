[package]
name = "s2"
version = "0.1.0"
edition = "2024"

[dependencies]
mimalloc = "0.1.52"
num-bigint = "0.4.6"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2.19"
rustc-hash = "1.1"

[profile.release]
debug = true

[features]
default = ["rust-compiler"]
# The compiler in Rust (plan/08, P13.5). Without it, s2 compiles only with
# the compiler in Scheme, and starts from images a build with it made:
# s2-core.s2o and s2-compiler.s2o next to the executable, or the files
# S2_CORE_IMAGE and S2_COMPILER_IMAGE name.
rust-compiler = []
# Count executed instructions, by opcode and by consecutive pair, and print
# the counts at exit (plan/05 §7): what superinstructions would pay.
# cargo run --release --features stats -- bench/fib.scm
stats = []
